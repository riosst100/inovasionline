name: inovasionline_driver
description: "Aplikasi ringan driver Inovasi Online: konfirmasi pesanan dikirim dan diterima dengan scan QR dan foto bukti."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.1.1
  intl: ^0.19.0
  flutter_dotenv: ^5.2.1
  image_picker: ^1.1.2
  mobile_scanner: ^7.0.1
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  location: ^10.0.2
  android_intent_plus: ^5.2.0
  app_links: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.3

# Same mark as the customer/admin apps, on blue with an amber "Driver" pill.
# Images are rendered from apps/assets/images/logo.svg geometry.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_driver_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#1E3A8A"
  adaptive_icon_background: "assets/images/logo_driver_background.png"
  adaptive_icon_foreground: "assets/images/logo_driver_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - .env.dev
    - .env.prod
    - assets/images/logo_app.png
