name: inovasionline_driver
description: "Aplikasi ringan driver Inovasi Online: konfirmasi pesanan dikirim dan diterima dengan scan QR dan foto bukti."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.1.1
  intl: ^0.19.0
  flutter_dotenv: ^5.2.1
  image_picker: ^1.1.2
  mobile_scanner: ^7.0.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - .env.dev
    - .env.prod
    - assets/images/logo_app.png
