org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Disable Kotlin incremental compilation. Moving GRADLE_USER_HOME/PUB_CACHE to D:
# fixed the original cross-drive relativeTo() crash, but re-enabling incremental
# still hits Kotlin daemon "Storage [...] is already registered" errors on this
# Windows setup (concurrent/stale daemon reusing the same cache files). Keep this
# off until upstream is stable rather than chasing daemon corruption bugs.
kotlin.incremental=false
# AdMob App ID for the prod flavor (AdMob → Apps → App settings). Leave empty to
# build with Google's sample App ID; the dev flavor always uses the sample ID.
admobAppIdAndroid=
# Google Maps SDK for Android key (Cloud Console → APIs & Services → Credentials), restricted to
# the app's package names + signing SHA-1. Used by the order tracking map; empty = blank map.
googleMapsApiKeyAndroid=
