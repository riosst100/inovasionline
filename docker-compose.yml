name: inovasionline

x-backend: &backend
  build:
    context: ./docker/backend
    dockerfile: Dockerfile
  image: inovasionline-backend:dev
  entrypoint: ["backend-entrypoint"]
  user: "${UID:-1000}:${GID:-1000}"
  working_dir: /app
  volumes:
    - ./backend:/app
  environment:
    APP_ENV: ${APP_ENV:-local}
    APP_DEBUG: ${APP_DEBUG:-true}
    APP_URL: ${API_URL:-http://localhost:8000}
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:-inovasionline_marketplace}
    DB_USERNAME: ${DB_USERNAME:-postgres}
    DB_PASSWORD: ${DB_PASSWORD:-postgres}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REVERB_HOST: reverb
    REVERB_SERVER_HOST: "0.0.0.0"
    REVERB_PORT: 8080
    REVERB_SCHEME: http
    SCOUT_DRIVER: meilisearch
    MEILISEARCH_HOST: http://meilisearch:7700
    MEILISEARCH_KEY: ${MEILI_MASTER_KEY:-inovasionline-dev-master-key}
  restart: unless-stopped

# Next.js dev server (hot reload). node_modules & .next live in named volumes so the
# Windows host's node_modules never leak into the Linux container; `npm ci` reruns
# whenever package-lock.json changes.
x-next-dev: &next-dev
  image: node:22-alpine
  working_dir: /app
  command:
    - sh
    - -c
    - |
      h=$$(md5sum package-lock.json | cut -d' ' -f1)
      if [ "$$(cat node_modules/.lock-hash 2>/dev/null)" != "$$h" ]; then
        npm ci --no-audit --no-fund && echo "$$h" > node_modules/.lock-hash
      fi
      exec npm run dev -- -H 0.0.0.0 -p 3000
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    container_name: inovasionline-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-inovasionline_marketplace}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-inovasionline_marketplace}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.2-alpine
    container_name: inovasionline-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.13
    container_name: inovasionline-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-inovasionline-dev-master-key}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "${MEILI_PORT:-7700}:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    <<: *backend
    container_name: inovasionline-backend
    command: ["serve"]
    ports:
      - "${BACKEND_PORT:-8000}:8000"
      - "${BACKEND_ALT_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  reverb:
    <<: *backend
    container_name: inovasionline-reverb
    command: ["reverb"]
    ports:
      - "${REVERB_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_started

  queue:
    <<: *backend
    container_name: inovasionline-queue
    command: ["queue"]
    depends_on:
      backend:
        condition: service_started

  admin:
    <<: *next-dev
    container_name: inovasionline-admin
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001/api}
      NEXT_TELEMETRY_DISABLED: 1
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend-admin:/app
      - admin_node_modules:/app/node_modules
      - admin_next:/app/.next
    ports:
      - "${ADMIN_PORT:-3000}:3000"
    depends_on:
      - backend

  frontend:
    <<: *next-dev
    container_name: inovasionline-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${FRONTEND_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_SITE_URL: ${FRONTEND_SITE_URL:-http://localhost:3001}
      # Server-side fetches go straight to the backend container.
      API_INTERNAL_URL: http://backend:8000/api/v1
      NEXT_TELEMETRY_DISABLED: 1
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    depends_on:
      - backend

volumes:
  admin_node_modules:
  admin_next:
  frontend_node_modules:
  frontend_next:
  db_data:
  redis_data:
  meili_data:
