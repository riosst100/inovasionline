name: inovasionline_admin
description: "Aplikasi admin Inovasi Online (versi mobile dari frontend-admin)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  flutter_secure_storage: ^11.1.1
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  flutter_dotenv: ^5.2.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  qr_flutter: ^4.1.0
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

# Same mark as the customer app, on dark gray with a hint of green and an "Admin" pill.
# Native splash cannot do gradients, so it (and the intro after it) uses solid #2A3436.
# Images are rendered from apps/assets/images/logo.svg geometry.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_admin_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#2A3436"
  adaptive_icon_background: "assets/images/logo_admin_background.png"
  adaptive_icon_foreground: "assets/images/logo_admin_foreground.png"

flutter_native_splash:
  color: "#2A3436"
  image: "assets/images/logo_splash.png"
  android_12:
    image: "assets/images/logo_splash.png"
    color: "#2A3436"
  web: false

flutter:
  uses-material-design: true

  assets:
    - .env
    - .env.dev
    - .env.prod
    - assets/images/logo_app.png
    - assets/images/logo_splash_mark.png

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
